name: member_onboarding
description: "Member onboarding forms, as one screen any Flutter app can open."
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ">=10.0.0 <12.0.0"
  geolocator: ">=14.0.2 <15.0.0"
  http: ">=1.2.0 <2.0.0"
  image_cropper: ^13.0.0
  image_picker: ">=1.2.0 <2.0.0"
  mobile_scanner: ^7.4.3
  path_provider: ">=2.1.4 <3.0.0"
  uuid: ">=4.5.0 <5.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

