[project]
name = "member-onboarding-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "celery>=5.6.3",
    "cryptography>=50.0.2",
    "django>=6.1,<6.2",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pyotp>=2.10.0",
    "pypdf>=6.21.4",
    "redis>=8.1.0",
    "structlog>=26.1.0",
    "weasyprint>=70.0",
    "zxing-cpp>=2.3",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pypdf>=6.21.4",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "DJ", "T20"]
ignore = ["S101", "DJ001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S505"]
