openapi: 3.0.3
info:
  title: Member Onboarding API
  version: 1.0.0
  description: Multi-organization member onboarding platform.
paths:
  /api/v1/applications/:
    get:
      operationId: applications_list
      parameters:
      - in: query
        name: approved_from
        schema:
          type: string
          format: date
      - in: query
        name: approved_to
        schema:
          type: string
          format: date
      - in: query
        name: created_from
        schema:
          type: string
          format: date
      - in: query
        name: created_to
        schema:
          type: string
          format: date
      - in: query
        name: mine
        schema:
          type: boolean
        description: Only forms this person started.
      - in: query
        name: mpp
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: q
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      tags:
      - applications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApplicationListList'
          description: ''
    post:
      operationId: applications_create
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
          description: ''
  /api/v1/applications/{id}/:
    get:
      operationId: applications_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this application.
        required: true
      tags:
      - applications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
          description: ''
    patch:
      operationId: applications_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this application.
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedApplicationSaveRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/applications/{id}/checks/:
    post:
      operationId: applications_checks_create
      description: Ticks or unticks one check of a step this person can approve now.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this application.
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepTickRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepTicks'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/applications/{id}/contact-otp/:
    post:
      operationId: applications_contact_otp_create
      description: Sends a code to the form's mobile number or email, for the member
        to read out.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactOtpRequestRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactOtpSent'
          description: ''
  /api/v1/applications/{id}/contact-otp/verify/:
    post:
      operationId: applications_contact_otp_verify_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactOtpVerifyRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactVerified'
          description: ''
  /api/v1/applications/{id}/data-export/:
    get:
      operationId: applications_data_export_retrieve
      description: Everything held about this form's member, decrypted. Always audited.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this application.
        required: true
      tags:
      - applications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/zip:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/applications/{id}/decide/:
    post:
      operationId: applications_decide_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this application.
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/applications/{id}/discard/:
    post:
      operationId: applications_discard_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this application.
        required: true
      tags:
      - applications
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/applications/{id}/documents/:
    get:
      operationId: applications_documents_list
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
          description: ''
    post:
      operationId: applications_documents_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - applications
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUploadRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/applications/{id}/marks/:
    get:
      operationId: applications_marks_list
      description: |-
        Fields marked wrong on this submission, by everyone reviewing it. A PUT marks one
        field, or changes the reason of this person's mark on it.
      parameters:
      - in: query
        name: approved_from
        schema:
          type: string
          format: date
      - in: query
        name: approved_to
        schema:
          type: string
          format: date
      - in: query
        name: created_from
        schema:
          type: string
          format: date
      - in: query
        name: created_to
        schema:
          type: string
          format: date
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this application.
        required: true
      - in: query
        name: mine
        schema:
          type: boolean
        description: Only forms this person started.
      - in: query
        name: mpp
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: q
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      tags:
      - applications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFieldMarkList'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    put:
      operationId: applications_marks_update
      description: |-
        Fields marked wrong on this submission, by everyone reviewing it. A PUT marks one
        field, or changes the reason of this person's mark on it.
      parameters:
      - in: query
        name: approved_from
        schema:
          type: string
          format: date
      - in: query
        name: approved_to
        schema:
          type: string
          format: date
      - in: query
        name: created_from
        schema:
          type: string
          format: date
      - in: query
        name: created_to
        schema:
          type: string
          format: date
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this application.
        required: true
      - in: query
        name: mine
        schema:
          type: boolean
        description: Only forms this person started.
      - in: query
        name: mpp
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: q
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldMarkRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFieldMarkList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/applications/{id}/marks/{mark_id}/:
    delete:
      operationId: applications_marks_destroy
      parameters:
      - in: query
        name: approved_from
        schema:
          type: string
          format: date
      - in: query
        name: approved_to
        schema:
          type: string
          format: date
      - in: query
        name: created_from
        schema:
          type: string
          format: date
      - in: query
        name: created_to
        schema:
          type: string
          format: date
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this application.
        required: true
      - in: path
        name: mark_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      - in: query
        name: mine
        schema:
          type: boolean
        description: Only forms this person started.
      - in: query
        name: mpp
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: q
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      tags:
      - applications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFieldMarkList'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/applications/{id}/numbers/:
    post:
      operationId: applications_numbers_create
      description: A POST, so nothing caches it. Every look is written to the audit
        log.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this application.
        required: true
      tags:
      - applications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensitiveNumbers'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/applications/{id}/payment/:
    post:
      operationId: applications_payment_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this application.
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/applications/{id}/pdf/:
    get:
      operationId: applications_pdf_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this application.
        required: true
      - in: query
        name: variant
        schema:
          type: string
          enum:
          - full
          - single
        description: 'Default: full.'
      tags:
      - applications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/applications/{id}/preview-pdf/:
    get:
      operationId: applications_preview_pdf_retrieve
      description: The printed form before final approval, marked as a draft. Nothing
        is stored.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this application.
        required: true
      - in: query
        name: variant
        schema:
          type: string
          enum:
          - full
          - single
        description: 'Default: full.'
      tags:
      - applications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/applications/{id}/steps/{step}/withdraw/:
    post:
      operationId: applications_steps_withdraw_create
      description: Takes back a step approval given by mistake, while the form is
        at that stage.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this application.
        required: true
      - in: path
        name: step
        schema:
          type: string
          pattern: ^[a-z_]+$
        required: true
      tags:
      - applications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/applications/{id}/submit/:
    post:
      operationId: applications_submit_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this application.
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/applications/counts/:
    get:
      operationId: applications_counts_retrieve
      tags:
      - applications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusCounts'
          description: ''
  /api/v1/applications/dashboard/:
    get:
      operationId: applications_dashboard_retrieve
      tags:
      - applications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/applications/form/:
    get:
      operationId: applications_form_retrieve
      description: The form definition, so clients render exactly what the server
        validates.
      tags:
      - applications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/applications/reject-reasons/:
    get:
      operationId: applications_reject_reasons_list
      description: The ready-made reasons a reviewer can pick when sending a form
        back.
      tags:
      - applications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RejectReason'
          description: ''
  /api/v1/applications/summary/:
    get:
      operationId: applications_summary_retrieve
      description: How many forms were started, submitted, approved and so on, between
        two dates.
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
      - in: query
        name: mine
        schema:
          type: boolean
      - in: query
        name: to
        schema:
          type: string
          format: date
      tags:
      - applications
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/audit/events/:
    get:
      operationId: audit_events_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: action__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: actor_id
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: q
        required: false
        in: query
        description: A search term.
        schema:
