          $ref: '#/components/schemas/StepEnum'
        text:
          type: string
          minLength: 1
          maxLength: 200
        ticked:
          type: boolean
      required:
      - step
      - text
      - ticked
    StepTicks:
      type: object
      properties:
        step:
          type: string
        ticked:
          type: array
          items:
            type: string
      required:
      - step
      - ticked
    SubmitRequest:
      type: object
      properties:
        version:
          type: integer
    Tehsil:
      type: object
      description: The unique constraint includes the organization, which clients
        never send.
      properties:
        district:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 10
        name:
          type: string
          maxLength: 150
        name_hi:
          type: string
          maxLength: 150
        is_active:
          type: boolean
        parent_label:
          type: string
          readOnly: true
      required:
      - code
      - district
      - id
      - name
      - parent_label
    TehsilName:
      type: object
      description: 'Only the names: the code and its district come from the ERP.'
      properties:
        name:
          type: string
          maxLength: 150
        name_hi:
          type: string
          maxLength: 150
      required:
      - name
    TemporaryPassword:
      type: object
      properties:
        temporary_password:
          type: string
      required:
      - temporary_password
    TokenPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    TrustedIssuer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        issuer:
          type: string
          maxLength: 200
        audience:
          type: string
          maxLength: 200
        public_key:
          type: string
          description: RSA public key in PEM format.
        default_role_code:
          description: Role given on first sign-in. Blank grants nothing.
          oneOf:
          - type: string
            maxLength: 60
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        syncs_mpp_assignments:
          type: boolean
          description: Treat the host's MPP list as the source of truth.
        is_active:
          type: boolean
      required:
      - audience
      - id
      - issuer
      - name
      - public_key
    TrustedIssuerRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        issuer:
          type: string
          minLength: 1
          maxLength: 200
        audience:
          type: string
          minLength: 1
          maxLength: 200
        public_key:
          type: string
          minLength: 1
          description: RSA public key in PEM format.
        default_role_code:
          description: Role given on first sign-in. Blank grants nothing.
          oneOf:
          - type: string
            maxLength: 60
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        syncs_mpp_assignments:
          type: boolean
          description: Treat the host's MPP list as the source of truth.
        is_active:
          type: boolean
      required:
      - audience
      - issuer
      - name
      - public_key
    UnreadCount:
      type: object
      properties:
        unread:
          type: integer
      required:
      - unread
    VariantEnum:
      enum:
      - full
      - single
      type: string
      description: |-
        * `full` - full
        * `single` - single
    Village:
      type: object
      description: The unique constraint includes the organization, which clients
        never send.
      properties:
        tehsil:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          pattern: ^\d{8}$
          maxLength: 8
        name:
          type: string
          maxLength: 150
        name_hi:
          type: string
          maxLength: 150
        is_active:
          type: boolean
        parent_label:
          type: string
          readOnly: true
      required:
      - code
      - id
      - name
      - parent_label
      - tehsil
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
