components:
  schemas:
    AcceptInvitationRequest:
      type: object
      properties:
        organization:
          type: string
          minLength: 1
          pattern: ^[-a-zA-Z0-9_]+$
        token:
          type: string
          minLength: 1
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - full_name
      - organization
      - password
      - token
    ApplicationCreateRequest:
      type: object
      properties:
        client_id:
          type: string
          minLength: 1
          maxLength: 100
        mpp:
          type: string
          format: uuid
      required:
      - client_id
      - mpp
    ApplicationDetail:
      type: object
      description: Sensitive numbers appear only as their last four digits.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        form_number:
          type: string
          maxLength: 20
        aadhaar_last4:
          type: string
          maxLength: 4
        mobile:
          type: string
          readOnly: true
        photo_id:
          type: string
          nullable: true
          description: The member's photo, for a list to show; only lists and the
            form page carry it.
          readOnly: true
        status:
          $ref: '#/components/schemas/ApplicationStatusEnum'
        status_label:
          type: string
          readOnly: true
        mpp:
          type: string
          format: uuid
        mpp_code:
          type: string
          readOnly: true
        mpp_name:
          type: string
          readOnly: true
        applicant_name:
          type: string
          readOnly: true
        created_by_name:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        waiting_since:
          type: string
          format: date-time
          nullable: true
          description: When it reached its current stage. Only lists and the form
            page carry it.
          readOnly: true
        is_overdue:
          type: boolean
          readOnly: true
        tr_code:
          type: string
          nullable: true
          readOnly: true
        approved_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        stages:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        client_id:
          type: string
          description: Generated by the device, so a retried create is not doubled.
          maxLength: 100
        form_version:
          type: integer
          maximum: 32767
          minimum: 0
        version:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Rejects overlapping edits.
        revision:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Number of submissions so far.
        data: {}
        account_last4:
          type: string
          maxLength: 4
        last_edited_by_name:
          type: string
          maxLength: 200
        rejection_reason:
          type: string
        rejected_fields: {}
        rejected_field_notes: {}
        payment: {}
        computed:
          type: object
          additionalProperties: {}
          readOnly: true
        warnings:
          type: array
          items:
            type: string
          description: Worth an approver's attention, but not grounds to block a submission.
          readOnly: true
        field_warnings:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        fee:
          type: object
          additionalProperties: {}
          readOnly: true
        place:
          type: object
          additionalProperties: {}
          description: 'The form''s own copy of the place first: it is what was submitted
            and signed.'
          readOnly: true
        mpp_place:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        review_steps:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        contact_verified:
          type: object
          additionalProperties: {}
          description: When the mobile number and email were confirmed by OTP, or
            null.
          readOnly: true
        duplicate_fields:
          type: object
          additionalProperties:
            type: string
          description: 'Set only by a save: what was not kept because another form
            or member has it.'
          readOnly: true
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/Decision'
          readOnly: true
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/Revision'
          readOnly: true
      required:
      - applicant_name
      - approved_at
      - client_id
      - computed
      - contact_verified
      - created_at
      - created_by_name
      - decisions
      - duplicate_fields
      - fee
      - field_warnings
      - id
      - is_overdue
      - last_edited_by_name
      - mobile
      - mpp
      - mpp_code
      - mpp_name
      - mpp_place
      - photo_id
      - place
      - review_steps
      - revisions
      - stages
      - status_label
      - tr_code
      - updated_at
      - waiting_since
      - warnings
    ApplicationList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        form_number:
          type: string
          maxLength: 20
        aadhaar_last4:
          type: string
          maxLength: 4
        mobile:
          type: string
          readOnly: true
        photo_id:
          type: string
          nullable: true
          description: The member's photo, for a list to show; only lists and the
            form page carry it.
          readOnly: true
        status:
          $ref: '#/components/schemas/ApplicationStatusEnum'
        status_label:
          type: string
          readOnly: true
        mpp:
          type: string
          format: uuid
        mpp_code:
          type: string
          readOnly: true
        mpp_name:
          type: string
          readOnly: true
        applicant_name:
          type: string
          readOnly: true
        created_by_name:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        waiting_since:
          type: string
          format: date-time
          nullable: true
          description: When it reached its current stage. Only lists and the form
            page carry it.
          readOnly: true
        is_overdue:
          type: boolean
          readOnly: true
        tr_code:
          type: string
          readOnly: true
        approved_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - applicant_name
      - approved_at
      - created_at
      - created_by_name
      - id
      - is_overdue
      - mobile
      - mpp
      - mpp_code
      - mpp_name
      - photo_id
      - status_label
      - tr_code
      - updated_at
      - waiting_since
    ApplicationStatusEnum:
      enum:
      - draft
      - pending_am
      - pending_cs
      - pending_finance
      - rejected
      - approved
      - discarded
      type: string
      description: |-
        * `draft` - Draft
        * `pending_am` - Pending Area Manager
        * `pending_cs` - Pending CS & Legal
        * `pending_finance` - Pending Finance
        * `rejected` - Rejected
        * `approved` - Approved
        * `discarded` - Discarded
    AssignMccRequest:
      type: object
      properties:
        membership:
          type: string
          format: uuid
      required:
      - membership
    AssignMppRequest:
      type: object
      properties:
        membership:
          type: string
          format: uuid
        responsibility:
          $ref: '#/components/schemas/ResponsibilityEnum'
      required:
