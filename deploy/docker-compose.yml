# PostgreSQL stays outside: point DATABASE_URL at the existing database server.
# Run from this folder, with a filled-in .env beside this file.

x-backend: &backend
  build:
    context: ..
    dockerfile: deploy/backend.Dockerfile
  env_file: .env
  restart: unless-stopped
  volumes:
    - ${MEDIA_PATH:-/var/lib/member-onboarding/media}:/var/lib/member-onboarding/media

services:
  migrate:
    <<: *backend
    restart: "no"
    command: sh -c "python manage.py migrate --noinput && python manage.py sync_system_roles"

  backend:
    <<: *backend
    # A PDF with the form's photos can take ~400 MB while WeasyPrint renders it.
    # Five workers let five people open PDFs at once; each is replaced after
    # 1000 requests so memory WeasyPrint keeps is handed back.
    command: >-
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers 5 --threads 4 --timeout 60
      --max-requests 1000 --max-requests-jitter 100
    deploy:
      resources:
        limits:
          memory: 3G
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/health/live/', headers={'Host': 'localhost'}))"
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *backend
    # Bulk PDFs and exports run here, four chunks at a time. Each child is
    # replaced after 50 tasks so WeasyPrint's memory is handed back.
    command: celery -A config worker -l INFO --concurrency 4 --max-tasks-per-child 50
    deploy:
      resources:
        limits:
          memory: 3G
    depends_on:
      backend:
        condition: service_started

  # Exactly one: two would send each scheduled job twice.
  beat:
    <<: *backend
    command: celery -A config beat -l INFO --schedule /tmp/celerybeat-schedule
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      backend:
        condition: service_started

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Stays under the container limit instead of being killed. Only keys with a
    # TTL (cache) are evicted, never the Celery queue.
    command: redis-server --save "" --appendonly no --maxmemory 400mb --maxmemory-policy volatile-lru
    deploy:
      resources:
        limits:
          memory: 512M

  admin:
    build:
      context: ..
      dockerfile: deploy/admin.Dockerfile
      args:
        NEXT_PUBLIC_DEFAULT_ORGANIZATION: ${NEXT_PUBLIC_DEFAULT_ORGANIZATION:-}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_PATH:-/etc/member-onboarding/tls}:/etc/nginx/tls:ro
    depends_on:
      - backend
      - admin
