server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Room for one document photo with its form fields.
    client_max_body_size 8m;

    # Overwritten, never appended: a caller must not be able to choose their address.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # The mobile package calls the API directly.
    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 60s;
    }

    # Everything else, including the portal's own /api routes.
    location / {
        proxy_pass http://admin:3000;
        proxy_read_timeout 120s;
    }
}
