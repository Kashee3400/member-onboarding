# /etc/nginx/sites-available/member_onboarding on 10.10.11.4
server {
    listen 80;
    server_name support.kasheemilk.com;
    include snippets/acme.conf;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name support.kasheemilk.com;
    ssl_certificate     /etc/letsencrypt/live/support.kasheemilk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.kasheemilk.com/privkey.pem;
    include snippets/kashee_ssl.conf;

    # Room for one document photo with its form fields.
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8002;
        # Overwritten, never appended: a caller must not be able to choose their address.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
